          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-experience"/></svg>
        </span>
        <span class="app-icon-label">Experience</span>
      </a>

      <!-- Games — pill-shape gamepad (D-pad and button shading is pure
           black so it reads on any accent). -->
      <a class="app-icon" href="projects/" data-app="projects" data-theme="projects" draggable="false">
        <span class="app-icon-face">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-projects"/></svg>
        </span>
        <span class="app-icon-label">Projects</span>
      </a>

      <!-- Links — two chain rings -->
      <a class="app-icon" href="links/" data-app="links" data-theme="links" draggable="false">
        <span class="app-icon-face">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-links"/></svg>
        </span>
        <span class="app-icon-label">Links</span>
      </a>

      <!-- Contacts — envelope with open flap -->
      <a class="app-icon" href="contacts/" data-app="contacts" data-theme="contacts" draggable="false">
        <span class="app-icon-face">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-contacts"/></svg>
        </span>
        <span class="app-icon-label">Contact</span>
      </a>
    </section>

  </main>

  <footer class="taskbar" aria-label="Taskbar">
    <button class="taskbar-start" type="button" aria-label="Show desktop">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3"  y="3"  width="8" height="8" rx="1" fill="currentColor"/>
        <rect x="13" y="3"  width="8" height="8" rx="1" fill="currentColor"/>
        <rect x="3"  y="13" width="8" height="8" rx="1" fill="currentColor"/>
        <rect x="13" y="13" width="8" height="8" rx="1" fill="currentColor"/>
      </svg>
      <span class="taskbar-label">Home</span>
    </button>

    <nav class="taskbar-apps" aria-label="Applications">
      <!-- Taskbar icons match the desktop icons exactly. -->
      <button class="taskbar-app" data-app="about" data-theme="about" type="button" aria-label="About Me">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-about"/></svg>
        <span class="taskbar-label">About Me</span>
      </button>
      <button class="taskbar-app is-disabled" data-app="blogs" data-theme="blogs" type="button" aria-label="Blogs (coming soon)" aria-disabled="true" title="Blogs: coming soon">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-blogs"/></svg>
        <span class="taskbar-label">Blogs</span>
      </button>
      <button class="taskbar-app" data-app="experience" data-theme="experience" type="button" aria-label="Experience">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-experience"/></svg>
        <span class="taskbar-label">Experience</span>
      </button>
      <button class="taskbar-app" data-app="projects" data-theme="projects" type="button" aria-label="Projects">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-projects"/></svg>
        <span class="taskbar-label">Projects</span>
      </button>
      <button class="taskbar-app" data-app="links" data-theme="links" type="button" aria-label="Links">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-links"/></svg>
        <span class="taskbar-label">Links</span>
      </button>
      <button class="taskbar-app" data-app="contacts" data-theme="contacts" type="button" aria-label="Contacts">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#icon-contacts"/></svg>
        <span class="taskbar-label">Contact</span>
      </button>
    </nav>

    <div class="taskbar-clock">
      <span id="clock-time">--:--</span>
      <span id="clock-date">--/--/----</span>
    </div>
  </footer>


  <script src="js/clock.js?v=23"></script>
  <script src="js/desktop.js?v=23"></script>
</body>
</html>
