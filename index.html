<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuel Bouzanquet — Game Designer</title>
  <meta name="description" content="Personal portfolio of Samuel Bouzanquet — Game Designer specialising in systems and narrative.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="sketch-roughen">
        <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
        <feDisplacementMap in="SourceGraphic" scale="2.4"/>
      </filter>
      <filter id="sketch-roughen-light">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5"/>
        <feDisplacementMap in="SourceGraphic" scale="1.6"/>
      </filter>
    </defs>
  </svg>

  <main class="desktop" aria-label="Desktop">

    <div class="desktop-decor" aria-hidden="true">

      <div class="ink-splotch ink-purple-1"></div>
      <div class="ink-splotch ink-purple-2"></div>
      <div class="ink-splotch ink-green-1"></div>
      <div class="ink-splotch ink-green-2"></div>
      <div class="ink-splotch ink-gold-1"></div>

      <svg class="sketch sketch-dungeon" viewBox="0 0 110 80" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen)">
        <rect x="6" y="10" width="22" height="18"/>
        <rect x="42" y="14" width="26" height="22"/>
        <rect x="80" y="6" width="22" height="26"/>
        <rect x="14" y="48" width="24" height="24"/>
        <rect x="56" y="50" width="34" height="22"/>
        <line x1="28" y1="20" x2="42" y2="22"/>
        <line x1="68" y1="20" x2="80" y2="18"/>
        <line x1="22" y1="28" x2="22" y2="48"/>
        <line x1="38" y1="60" x2="56" y2="60"/>
        <line x1="86" y1="32" x2="86" y2="50"/>
        <path d="M 71 22 L 76 27 M 76 22 L 71 27"/>
        <circle cx="22" cy="60" r="1.5" fill="currentColor"/>
        <circle cx="92" cy="14" r="1.5" fill="currentColor"/>
      </svg>

      <svg class="sketch sketch-talents" viewBox="0 0 80 110" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen)">
        <line x1="40" y1="14" x2="20" y2="38"/>
        <line x1="40" y1="14" x2="60" y2="38"/>
        <line x1="20" y1="38" x2="10" y2="64"/>
        <line x1="20" y1="38" x2="30" y2="64"/>
        <line x1="60" y1="38" x2="50" y2="64"/>
        <line x1="60" y1="38" x2="70" y2="64"/>
        <line x1="30" y1="64" x2="40" y2="92"/>
        <line x1="50" y1="64" x2="40" y2="92"/>
        <circle cx="40" cy="14" r="6" fill="rgba(0,0,0,0.55)"/>
        <circle cx="20" cy="38" r="5"/>
        <circle cx="60" cy="38" r="5" fill="rgba(0,0,0,0.55)"/>
        <circle cx="10" cy="64" r="4"/>
        <circle cx="30" cy="64" r="4"/>
        <circle cx="50" cy="64" r="4"/>
        <circle cx="70" cy="64" r="4"/>
        <circle cx="40" cy="92" r="6"/>
      </svg>

      <svg class="sketch sketch-mechanic" viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen)">
        <rect x="6"  y="34" width="24" height="18" rx="2"/>
        <rect x="48" y="14" width="24" height="18" rx="2"/>
        <rect x="48" y="56" width="24" height="18" rx="2"/>
        <rect x="90" y="34" width="24" height="18" rx="2"/>
        <line x1="30" y1="42" x2="48" y2="22"/>
        <path d="M 48 22 L 42 22 M 48 22 L 45 27"/>
        <line x1="30" y1="44" x2="48" y2="64"/>
        <path d="M 48 64 L 42 63 M 48 64 L 45 60"/>
        <line x1="72" y1="22" x2="90" y2="40"/>
        <path d="M 90 40 L 86 36 M 90 40 L 86 42"/>
        <line x1="72" y1="64" x2="90" y2="46"/>
        <path d="M 90 46 L 86 48 M 90 46 L 86 44"/>
        <line x1="10" y1="40" x2="22" y2="40"/>
        <line x1="10" y1="44" x2="18" y2="44"/>
        <line x1="52" y1="20" x2="64" y2="20"/>
        <line x1="52" y1="62" x2="64" y2="62"/>
        <line x1="94" y1="40" x2="106" y2="40"/>
        <line x1="94" y1="44" x2="102" y2="44"/>
      </svg>

      <!-- Hades "Death Defiance" — heart shape with HP-bar element across it -->
      <svg class="sketch sketch-heart" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen)">
        <!-- Outer badge circle -->
        <circle cx="40" cy="40" r="34" stroke-width="1.6"/>
        <!-- Heart -->
        <path d="M 40 64 C 14 48, 10 28, 24 18 C 32 13, 40 20, 40 26 C 40 20, 48 13, 56 18 C 70 28, 66 48, 40 64 Z"/>
        <!-- HP bar slashed across -->
        <path d="M 18 44 L 62 36" stroke-width="2.4"/>
        <!-- Tiny flourish -->
        <circle cx="40" cy="32" r="1.5" fill="currentColor"/>
      </svg>

      <!-- Black Lotus (MTG) — card frame with a stylized lotus flower in the art box -->
      <svg class="sketch sketch-card" viewBox="0 0 70 100" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen)">
        <rect x="4" y="4" width="62" height="92" rx="3"/>
        <!-- Title bar -->
        <line x1="8" y1="14" x2="62" y2="14"/>
        <line x1="10" y1="11" x2="38" y2="11"/>
        <circle cx="58" cy="9" r="3"/>
        <!-- Art window -->
        <rect x="8" y="17" width="54" height="36"/>
        <!-- Stylized lotus: centre + 6 petals -->
        <path d="M 35 44 Q 30 32 35 24 Q 40 32 35 44 Z"/>
        <path d="M 35 44 Q 22 40 20 28 Q 30 30 35 44 Z"/>
        <path d="M 35 44 Q 48 40 50 28 Q 40 30 35 44 Z"/>
        <path d="M 35 44 Q 18 46 16 36"/>
        <path d="M 35 44 Q 52 46 54 36"/>
        <circle cx="35" cy="42" r="2" fill="currentColor"/>
        <!-- Leaves -->
        <path d="M 18 50 Q 26 46 30 50"/>
        <path d="M 40 50 Q 48 46 52 50"/>
        <!-- Type bar -->
        <line x1="8" y1="59" x2="62" y2="59"/>
        <line x1="10" y1="57" x2="28" y2="57"/>
        <!-- Text box lines -->
        <line x1="10" y1="65" x2="60" y2="65"/>
        <line x1="10" y1="70" x2="56" y2="70"/>
        <line x1="10" y1="75" x2="58" y2="75"/>
        <line x1="10" y1="80" x2="50" y2="80"/>
        <line x1="46" y1="89" x2="58" y2="89"/>
      </svg>

      <!-- Protoss Pylon (SC2) — faceted crystal obelisk on angular base -->
      <svg class="sketch sketch-pylon" viewBox="0 0 60 130" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen)">
        <!-- Crystal body -->
        <path d="M 30 4 L 14 26 L 14 88 L 30 104 L 46 88 L 46 26 Z"/>
        <!-- Horizontal facet bands -->
        <line x1="14" y1="26" x2="46" y2="26"/>
        <line x1="14" y1="88" x2="46" y2="88"/>
        <!-- Vertical centre seam -->
        <line x1="30" y1="4" x2="30" y2="104"/>
        <!-- Facet edges (two diagonals on each side of centre) -->
        <line x1="14" y1="26" x2="30" y2="40"/>
        <line x1="46" y1="26" x2="30" y2="40"/>
        <line x1="14" y1="88" x2="30" y2="74"/>
        <line x1="46" y1="88" x2="30" y2="74"/>
        <!-- Energy hum lines inside -->
        <line x1="22" y1="50" x2="38" y2="50" stroke-width="1.2"/>
        <line x1="22" y1="62" x2="38" y2="62" stroke-width="1.2"/>
        <!-- Golden angular base -->
        <path d="M 8 108 L 30 103 L 52 108 L 52 118 L 8 118 Z"/>
        <line x1="8" y1="112" x2="52" y2="112"/>
        <!-- Base support wings -->
        <path d="M 8 108 L 4 126 L 14 126"/>
        <path d="M 52 108 L 56 126 L 46 126"/>
      </svg>

      <!-- Elden Ring greatsword — long blade, ornate wide crossguard, decorated pommel -->
      <svg class="sketch sketch-sword" viewBox="0 0 80 180" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen)">
        <!-- Blade -->
        <path d="M 40 4 L 34 22 L 34 126 L 40 136 L 46 126 L 46 22 Z"/>
        <!-- Fuller (blood groove) -->
        <line x1="40" y1="20" x2="40" y2="124"/>
        <!-- Ornate crossguard — wide with flared ends -->
        <path d="M 6 136 L 18 132 L 62 132 L 74 136 L 72 144 L 60 144 L 60 150 L 20 150 L 20 144 L 8 144 Z"/>
        <line x1="20" y1="140" x2="60" y2="140"/>
        <circle cx="40" cy="141" r="3"/>
        <!-- Grip wrapping -->
        <rect x="36" y="150" width="8" height="20"/>
        <line x1="36" y1="154" x2="44" y2="154"/>
        <line x1="36" y1="158" x2="44" y2="158"/>
        <line x1="36" y1="162" x2="44" y2="162"/>
        <line x1="36" y1="166" x2="44" y2="166"/>
        <!-- Decorated pommel -->
        <circle cx="40" cy="174" r="5"/>
        <circle cx="40" cy="174" r="2" fill="currentColor"/>
      </svg>

      <figure class="screenshot screenshot-nexus">
        <div class="screenshot-image">
          <img src="_WebsiteAssets/NEXUSScreenshotThumbnail.png" alt="NEXUS screenshot">
          <svg class="screenshot-frame" viewBox="0 0 100 60" preserveAspectRatio="none">
            <rect x="1.5" y="1.5" width="97" height="57" fill="none" stroke="currentColor" stroke-width="0.6" vector-effect="non-scaling-stroke" filter="url(#sketch-roughen-light)"/>
          </svg>
        </div>
        <figcaption>Player Experience</figcaption>
      </figure>

      <figure class="screenshot screenshot-starvin">
        <div class="screenshot-image">
          <img src="_WebsiteAssets/STARVINMARTIANScreenshotThumbnail.png" alt="Starvin Martian screenshot">
          <svg class="screenshot-frame" viewBox="0 0 100 60" preserveAspectRatio="none">
            <rect x="1.5" y="1.5" width="97" height="57" fill="none" stroke="currentColor" stroke-width="0.6" vector-effect="non-scaling-stroke" filter="url(#sketch-roughen-light)"/>
          </svg>
        </div>
        <figcaption>Systems Design</figcaption>
      </figure>

      <figure class="screenshot screenshot-ordinem">
        <div class="screenshot-image">
          <img src="_WebsiteAssets/ORDINEMScreenshotThumbnail.png" alt="ORDINEM screenshot">
          <svg class="screenshot-frame" viewBox="0 0 100 60" preserveAspectRatio="none">
            <rect x="1.5" y="1.5" width="97" height="57" fill="none" stroke="currentColor" stroke-width="0.6" vector-effect="non-scaling-stroke" filter="url(#sketch-roughen-light)"/>
          </svg>
        </div>
        <figcaption>Mechanical Set Design</figcaption>
      </figure>

      <figure class="screenshot screenshot-wos">
        <div class="screenshot-image">
          <img src="_WebsiteAssets/WAROfSTEELScreenshotThumbnail.png" alt="War of Steel screenshot">
          <svg class="screenshot-frame" viewBox="0 0 100 60" preserveAspectRatio="none">
            <rect x="1.5" y="1.5" width="97" height="57" fill="none" stroke="currentColor" stroke-width="0.6" vector-effect="non-scaling-stroke" filter="url(#sketch-roughen-light)"/>
          </svg>
        </div>
        <figcaption>Level Design</figcaption>
      </figure>

    </div>

    <section class="identity-panel" aria-label="Samuel Bouzanquet">
      <figure class="portrait-figure">
        <div class="portrait-image">
          <img src="_WebsiteAssets/MeImageSamuel.jpg" alt="Photo of Samuel Bouzanquet" class="portrait">
          <svg class="portrait-frame-sketch" viewBox="0 0 100 130" preserveAspectRatio="none">
            <rect x="1.5" y="1.5" width="97" height="127" fill="none" stroke="currentColor" stroke-width="0.4" vector-effect="non-scaling-stroke" filter="url(#sketch-roughen-light)"/>
          </svg>
        </div>
      </figure>
      <h1 class="display-name">Samuel Bouzanquet</h1>
      <p class="tagline">Game Designer &bull; Systems &bull; Narrative</p>
    </section>

    <section class="app-grid" aria-label="Applications">
      <!-- About Me — filled person bust -->
      <button class="app-icon" data-app="about" data-theme="about" type="button">
        <span class="app-icon-face">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <circle cx="24" cy="16" r="8.5" fill="currentColor"/>
            <path d="M 8 44 Q 8 28 24 28 Q 40 28 40 44 Z" fill="currentColor"/>
            <path d="M 24 28 Q 40 28 40 44 L 24 44 Z" fill="rgba(0,0,0,0.15)"/>
          </svg>
        </span>
        <span class="app-icon-label">About Me</span>
      </button>

      <!-- Blogs — document with folded corner + text lines (now green-themed
           per iter 16; text-lines retinted from dark-gold to dark-green to
           match the new accent). -->
      <button class="app-icon" data-app="blogs" data-theme="blogs" type="button">
        <span class="app-icon-face">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path d="M 11 5 L 30 5 L 41 16 L 41 42 Q 41 44 39 44 L 11 44 Q 9 44 9 42 L 9 7 Q 9 5 11 5 Z" fill="currentColor"/>
            <path d="M 30 5 L 30 14 Q 30 16 32 16 L 41 16 Z" fill="rgba(0,0,0,0.25)"/>
            <rect x="14" y="22" width="20" height="2" rx="0.5" fill="rgba(5,56,29,0.55)"/>
            <rect x="14" y="28" width="20" height="2" rx="0.5" fill="rgba(5,56,29,0.55)"/>
            <rect x="14" y="34" width="14" height="2" rx="0.5" fill="rgba(5,56,29,0.55)"/>
          </svg>
        </span>
        <span class="app-icon-label">Blogs</span>
      </button>

      <!-- Games — pill-shape gamepad (yellow-themed per iter 16; D-pad and
           button shading is pure black so it reads correctly on either
           accent). -->
      <button class="app-icon" data-app="games" data-theme="games" type="button">
        <span class="app-icon-face">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <rect x="3" y="14" width="42" height="22" rx="11" fill="currentColor"/>
            <rect x="10" y="23" width="10" height="4" rx="0.5" fill="rgba(0,0,0,0.4)"/>
            <rect x="13" y="20" width="4" height="10" rx="0.5" fill="rgba(0,0,0,0.4)"/>
            <circle cx="32" cy="21" r="2.2" fill="rgba(0,0,0,0.4)"/>
            <circle cx="38" cy="25" r="2.2" fill="rgba(0,0,0,0.4)"/>
            <circle cx="32" cy="29" r="2.2" fill="rgba(0,0,0,0.4)"/>
          </svg>
        </span>
        <span class="app-icon-label">Games</span>
      </button>

      <!-- Experience — briefcase -->
      <button class="app-icon" data-app="experience" data-theme="experience" type="button">
        <span class="app-icon-face">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <rect x="17" y="10" width="14" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
            <rect x="5" y="16" width="38" height="28" rx="3" fill="currentColor"/>
            <rect x="5" y="25" width="38" height="2" fill="rgba(0,0,0,0.3)"/>
            <rect x="21" y="23" width="6" height="4" rx="0.8" fill="rgba(45,30,8,0.55)"/>
            <rect x="5" y="16" width="38" height="2.5" fill="rgba(45,30,8,0.4)"/>
          </svg>
        </span>
        <span class="app-icon-label">Experience</span>
      </button>

      <!-- Links — two chain rings -->
      <button class="app-icon" data-app="links" data-theme="links" type="button">
        <span class="app-icon-face">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <ellipse cx="16" cy="24" rx="10" ry="6.5" fill="none" stroke="currentColor" stroke-width="5"/>
            <ellipse cx="32" cy="24" rx="10" ry="6.5" fill="none" stroke="currentColor" stroke-width="5"/>
          </svg>
        </span>
        <span class="app-icon-label">Links</span>
      </button>

      <!-- Contacts — envelope with open flap -->
      <button class="app-icon" data-app="contacts" data-theme="contacts" type="button">
        <span class="app-icon-face">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <rect x="5" y="14" width="38" height="24" rx="2" fill="currentColor"/>
            <path d="M 5 14 L 24 29 L 43 14 Z" fill="rgba(0,0,0,0.35)"/>
            <path d="M 5 14 L 24 29 L 43 14" fill="none" stroke="rgba(45,11,61,0.6)" stroke-width="1" stroke-linejoin="round"/>
            <path d="M 5 14 L 5 38" stroke="rgba(45,11,61,0.45)" stroke-width="1"/>
          </svg>
        </span>
        <span class="app-icon-label">Contacts</span>
      </button>
    </section>

  </main>

  <footer class="taskbar" aria-label="Taskbar">
    <button class="taskbar-start" type="button" aria-label="Show desktop">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3"  y="3"  width="8" height="8" rx="1" fill="currentColor"/>
        <rect x="13" y="3"  width="8" height="8" rx="1" fill="currentColor"/>
        <rect x="3"  y="13" width="8" height="8" rx="1" fill="currentColor"/>
        <rect x="13" y="13" width="8" height="8" rx="1" fill="currentColor"/>
      </svg>
    </button>

    <nav class="taskbar-apps" aria-label="Applications">
      <!-- Taskbar icons match the desktop icons exactly. -->
      <button class="taskbar-app" data-app="about" data-theme="about" type="button" aria-label="About Me">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <circle cx="24" cy="16" r="8.5" fill="currentColor"/>
          <path d="M 8 44 Q 8 28 24 28 Q 40 28 40 44 Z" fill="currentColor"/>
          <path d="M 24 28 Q 40 28 40 44 L 24 44 Z" fill="rgba(0,0,0,0.15)"/>
        </svg>
      </button>
      <button class="taskbar-app" data-app="blogs" data-theme="blogs" type="button" aria-label="Blogs">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path d="M 11 5 L 30 5 L 41 16 L 41 42 Q 41 44 39 44 L 11 44 Q 9 44 9 42 L 9 7 Q 9 5 11 5 Z" fill="currentColor"/>
          <path d="M 30 5 L 30 14 Q 30 16 32 16 L 41 16 Z" fill="rgba(0,0,0,0.25)"/>
          <rect x="14" y="22" width="20" height="2" rx="0.5" fill="rgba(5,56,29,0.55)"/>
          <rect x="14" y="28" width="20" height="2" rx="0.5" fill="rgba(5,56,29,0.55)"/>
          <rect x="14" y="34" width="14" height="2" rx="0.5" fill="rgba(5,56,29,0.55)"/>
        </svg>
      </button>
      <button class="taskbar-app" data-app="games" data-theme="games" type="button" aria-label="Games">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <rect x="3" y="14" width="42" height="22" rx="11" fill="currentColor"/>
          <rect x="10" y="23" width="10" height="4" rx="0.5" fill="rgba(0,0,0,0.4)"/>
          <rect x="13" y="20" width="4" height="10" rx="0.5" fill="rgba(0,0,0,0.4)"/>
          <circle cx="32" cy="21" r="2.2" fill="rgba(0,0,0,0.4)"/>
          <circle cx="38" cy="25" r="2.2" fill="rgba(0,0,0,0.4)"/>
          <circle cx="32" cy="29" r="2.2" fill="rgba(0,0,0,0.4)"/>
        </svg>
      </button>
      <button class="taskbar-app" data-app="experience" data-theme="experience" type="button" aria-label="Experience">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <rect x="17" y="10" width="14" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
          <rect x="5" y="16" width="38" height="28" rx="3" fill="currentColor"/>
          <rect x="5" y="25" width="38" height="2" fill="rgba(0,0,0,0.3)"/>
          <rect x="21" y="23" width="6" height="4" rx="0.8" fill="rgba(45,30,8,0.55)"/>
          <rect x="5" y="16" width="38" height="2.5" fill="rgba(45,30,8,0.4)"/>
        </svg>
      </button>
      <button class="taskbar-app" data-app="links" data-theme="links" type="button" aria-label="Links">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <ellipse cx="16" cy="24" rx="10" ry="6.5" fill="none" stroke="currentColor" stroke-width="5"/>
          <ellipse cx="32" cy="24" rx="10" ry="6.5" fill="none" stroke="currentColor" stroke-width="5"/>
        </svg>
      </button>
      <button class="taskbar-app" data-app="contacts" data-theme="contacts" type="button" aria-label="Contacts">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <rect x="5" y="14" width="38" height="24" rx="2" fill="currentColor"/>
          <path d="M 5 14 L 24 29 L 43 14 Z" fill="rgba(0,0,0,0.35)"/>
          <path d="M 5 14 L 24 29 L 43 14" fill="none" stroke="rgba(45,11,61,0.6)" stroke-width="1" stroke-linejoin="round"/>
          <path d="M 5 14 L 5 38" stroke="rgba(45,11,61,0.45)" stroke-width="1"/>
        </svg>
      </button>
    </nav>

    <div class="taskbar-clock" aria-live="polite">
      <span id="clock-time">--:--</span>
      <span id="clock-date">--/--/----</span>
    </div>
  </footer>

  <!--
    APP WINDOW CONTENT TEMPLATES
    ----------------------------
    Each <template id="app-content-<id>"> below holds the body HTML for one
    app window. js/desktop.js clones this into the window-body when the app
    opens. Edit the inner HTML directly to update content — no JS changes
    needed. Placeholder text is wrapped with [brackets] where it should be
    replaced by Samuel; everything else is structural/styling.

        <div class="app-bio">
          <p>Hello, I am Samuel! I am a game designer and creator who has worked for a couple of years helping create and design games. I am a huge gamer, who started when he was very young and never grew out of it. It evolved into wanting to not just play games &mdash; but also be a part of creating them!</p>

      <section class="app-bio-section">
        <h3 class="app-subtitle">My Love of Gaming</h3>
        <div class="app-bio">
          <p>I have always been a huge gamer &mdash; basically ever since we first got a Game Boy when I was about 7 or 8. From there it went to DS's, then World of Warcraft, then StarCraft 2, which released when I was almost 10!</p>
          <p>StarCraft, I immediately fell in love with the Zerg and to a lesser extent the Protoss; but when SC2 came out soon after I fell in love with the Zerg and the world all over again. To this day still probably my most absolutely loved game.</p>
          <p>Over the years I played a lot of those two Blizzard games, but also played League of Legends and Heroes of the Storm.</p>
          <p>As I got older, towards the end of my schooling years, I decided to branch out more as SC2 unfortunately began to die, and WoW just wasn't holding my attention anymore. 2020 was when I actually first made my Steam account and got a game on there! Dead by Daylight was the game I sunk my teeth into during covid. From there and over the last few years I was able to find and play even more games I loved as I expanded my repertoire even further &mdash; Skyrim, Vermintide, Control, Destiny 2, Darktide, Elden Ring, Outriders, Grim Dawn, Helldivers 2, WWZ: Aftermath and Hades (1 and now recently 2).</p>
          <p>Note, this list doesn't include non-Steam games that I absolutely loved, including Spellbreak (RIP), Fortnite, Evil Dead: The Game, MTG Arena and Legends of Runeterra (also RIP).</p>

      <section class="app-bio-section">
        <h3 class="app-subtitle">Getting Into Game Design</h3>
        <div class="app-bio">
          <p>I absolutely love games as you can see, but it never really struck me I could turn that into a job until a few years ago. I have always been incredibly creative and loved the idea of improving things to make them better.</p>
          <p>StarCraft 2 is where I first got my taste of game design and developed through their awesome editor! I made many games from it, and began designing my own games, getting people to playtest them, and taking that feedback onboard to iterate and improve said game.</p>
          <p>Then during covid I dabbled in it again by making a ginormous document for how to "fix" a game I really liked and played at the time, due to their very questionable balance (and design) decisions driving me mad. I was also all over forums for games I was playing and spinning up new ideas for content, balance, you name it.</p>
          <p>Then when the opportunity came to actually start being part of making games at the company I started with my family &mdash; PLAYA3ULL GAMES &mdash; I was lucky enough to be able to jump right into being part of games being made! And from there I realised this is what I'd love to do all the time, and quickly decided to study it properly.</p>
        </div>
