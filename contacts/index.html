<body class="page">
  <!-- Shown only without JavaScript; with it, desktop.js builds the desktop
       around this page and opens it in a window. -->
  <header class="page-header"><a href="./">Samuel Bouzanquet — Game Designer</a></header>
  <main class="page-main" data-page="contacts/">
    <article class="app-content app-contacts" data-theme="contacts">
      <header class="app-section-header">
        <h2 class="app-title">Get in touch</h2>
        <p class="app-eyebrow">Best route is email</p>
      </header>
      <div class="contact-block">
        <p class="contact-label">Email</p>
        <button type="button" class="contact-email-button" data-copy="sambouzanquet@gmail.com" aria-label="Copy email address to clipboard">
          <span class="contact-email" data-copy-text>sambouzanquet@gmail.com</span>
          <span class="contact-copy-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14"><rect x="4" y="4" width="9" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 11 V3 a1 1 0 0 1 1-1 h7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </span>
          <span class="contact-copy-feedback">Copied!</span>
        </button>
        <p class="contact-hint" data-copy-status aria-live="polite">Click or tap to copy the address.</p>
        <a class="contact-mailto" href="mailto:sambouzanquet@gmail.com">Or open it in your email app</a>
      </div>

      <!-- Doodles filling the bottom of the page below the email block
           (heart, bag of gold, scroll), sized to fill the bottom third. -->
      <div class="contact-doodles" aria-hidden="true">
        <figure class="contact-doodle contact-doodle-thanks">
          <svg viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen-light)">
            <!-- heart with sparkles around it -->
            <path d="M 55 92 C 24 70, 18 42, 32 30 C 42 24, 55 32, 55 38 C 55 32, 68 24, 78 30 C 92 42, 86 70, 55 92 Z"/>
            <path d="M 38 48 Q 46 44 54 48" stroke-width="1.4"/>
            <path d="M 56 48 Q 64 44 72 48" stroke-width="1.4"/>
            <!-- sparkles -->
            <path d="M 14 22 L 16 26 L 20 28 L 16 30 L 14 34 L 12 30 L 8 28 L 12 26 Z"/>
            <path d="M 92 14 L 94 18 L 98 20 L 94 22 L 92 26 L 90 22 L 86 20 L 90 18 Z"/>
            <path d="M 100 60 L 101 63 L 104 64 L 101 65 L 100 68 L 99 65 L 96 64 L 99 63 Z"/>
          </svg>
          <figcaption>thank you!</figcaption>
        </figure>

        <figure class="contact-doodle contact-doodle-click">
          <svg viewBox="0 0 140 110" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen-light)">
            <!-- bag body (rounded sack, fat at the bottom) -->
            <path d="M 50 32 Q 36 50 34 72 Q 32 96 52 100 L 88 100 Q 108 96 106 72 Q 104 50 90 32 Z"/>
            <!-- cinched neck with rope folds -->
            <path d="M 50 32 L 56 24 L 62 30 L 70 22 L 78 30 L 84 24 L 90 32"/>
            <!-- $ symbol on the bag -->
            <line x1="70" y1="46" x2="70" y2="84" stroke-width="1.6"/>
            <path d="M 80 56 Q 80 50 70 50 Q 60 50 60 58 Q 60 64 70 64 Q 80 64 80 72 Q 80 80 70 80 Q 60 80 60 74" stroke-width="1.6"/>
            <!-- coins spilled around the base -->
            <ellipse cx="20" cy="94" rx="8" ry="5"/>
            <line x1="14" y1="94" x2="26" y2="94" stroke-width="1.2"/>
            <ellipse cx="118" cy="96" rx="7" ry="4"/>
            <line x1="113" y1="96" x2="123" y2="96" stroke-width="1.2"/>
            <ellipse cx="128" cy="102" rx="6" ry="3"/>
            <!-- a coin tumbling out mid-air -->
            <circle cx="14" cy="76" r="4.5"/>
            <line x1="10" y1="76" x2="18" y2="76" stroke-width="1.2"/>
            <!-- sparkles for "treasure" feel -->
            <path d="M 14 18 L 16 22 L 20 24 L 16 26 L 14 30 L 12 26 L 8 24 L 12 22 Z"/>
            <path d="M 124 16 L 126 20 L 130 22 L 126 24 L 124 28 L 122 24 L 118 22 L 122 20 Z"/>
          </svg>
        </figure>

        <figure class="contact-doodle contact-doodle-scroll">
          <svg viewBox="0 0 130 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sketch-roughen-light)">
            <!-- main scroll (centre) -->
            <ellipse cx="22" cy="48" rx="10" ry="20"/>
            <ellipse cx="22" cy="48" rx="4" ry="10"/>
            <ellipse cx="108" cy="48" rx="10" ry="20"/>
            <ellipse cx="108" cy="48" rx="4" ry="10"/>
            <line x1="22" y1="28" x2="108" y2="28"/>
            <line x1="22" y1="68" x2="108" y2="68"/>
            <!-- scroll text lines -->
            <line x1="34" y1="37" x2="96" y2="37" stroke-width="1.4"/>
            <line x1="34" y1="45" x2="92" y2="45" stroke-width="1.4"/>
            <line x1="34" y1="53" x2="98" y2="53" stroke-width="1.4"/>
            <line x1="34" y1="61" x2="86" y2="61" stroke-width="1.4"/>

            <path d="M 8 12 L 10 16 L 14 18 L 10 20 L 8 24 L 6 20 L 2 18 L 6 16 Z"/>
            <path d="M 122 12 L 124 16 L 128 18 L 124 20 L 122 24 L 120 20 L 116 18 L 120 16 Z"/>
          </svg>
        </figure>
